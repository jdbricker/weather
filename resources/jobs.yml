# Job resources for Weather data workflow
resources:
  jobs:
    weather_data_workflow:
      name: weather_data_workflow_${bundle.target}
      
      # Schedule: Run daily at 2 AM UTC
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED
      
      # Email notifications on failure
      email_notifications:
        on_failure:
          - jdbricker@gmail.com
      
      # Job-level cluster for serverless compute
      job_clusters:
        - job_cluster_key: serverless_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            num_workers: 0
            data_security_mode: USER_ISOLATION
            runtime_engine: PHOTON
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: "local[*]"
            custom_tags:
              ResourceClass: SingleNode
      
      # Job tasks
      tasks:
        # Task 1: Fetch data from NOAA and write to volume
        - task_key: fetch_weather_data
          description: "Download weather data from NOAA and save to Unity Catalog volume"
          
          spark_python_task:
            python_file: ../src/fetch_data.py
          
          job_cluster_key: serverless_cluster
          
          libraries:
            - pypi:
                package: requests
        
        # Task 2: Run the pipeline (depends on Task 1)
        - task_key: process_weather_data
          description: "Process weather data through Bronze -> Silver -> Gold pipeline"
          
          depends_on:
            - task_key: fetch_weather_data
          
          pipeline_task:
            pipeline_id: ${resources.pipelines.weather_medallion.id}
            full_refresh: false
      
      # Permissions
      permissions:
        - level: CAN_VIEW
          group_name: users
